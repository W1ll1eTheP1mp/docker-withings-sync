name: Sync Withings to Garmin

on:
  schedule:
    - cron: '0 6 * * *' # Kjører automatisk hver morgen kl. 06:00 UTC
  workflow_dispatch: # Gjør at du kan trykke på "Run workflow"-knappen manuelt

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run Withings Sync
        uses: addnab/docker-run-action@v3
        with:
          image: jaroslawhartman/withings-sync:latest
          options: >-
            -e WITHINGS_CLIENT_ID=${{ secrets.WITHINGS_CLIENT_ID }}
            -e WITHINGS_CLIENT_SECRET=${{ secrets.WITHINGS_CLIENT_SECRET }}
            -e GARMIN_USERNAME=${{ secrets.GARMIN_USERNAME }}
            -e GARMIN_PASSWORD=${{ secrets.GARMIN_PASSWORD }}
          run: |
            python3 /app/withings-sync/withings_sync/main.py
