name: Sync Withings to Garmin

on:
  schedule:
    - cron: '0 6 * * *' 
  workflow_dispatch: 

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install withings-sync
        run: pip install withings-sync

      - name: Run withings-sync
        run: withings-sync --garmin-username "${{ secrets.GARMIN_USERNAME }}" --garmin-password "${{ secrets.GARMIN_PASSWORD }}" --withings-client-id "${{ secrets.WITHINGS_CLIENT_ID }}" --withings-client-secret "${{ secrets.WITHINGS_CLIENT_SECRET }}"
